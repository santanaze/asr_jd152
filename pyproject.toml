[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "santanaze-asr_jd152"
version = "0.1.0"
description = "从样本里推断语音识别算法工程师·线上分布漂移的检测应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "santanaze" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://santanaze.github.io"
Repository = "https://github.com/santanaze/asr_jd152"
Issues = "https://github.com/santanaze/asr_jd152/issues"

[project.scripts]
asr_jd152 = "asr_jd152:main"

[tool.setuptools]
py-modules = ["asr_jd152"]
